<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Evaluaciones · Ciclo 2026-2 · Made Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#1F2C34; --dark2:#2A3A44; --green:#70AD47; --green-d:#5C9139; --green-l:#EDF6E7;
  --yellow:#FFD966; --line:#dfe3e6; --line2:#eceff1;
  --txt:#22313a; --txt2:#5f7480; --bg2:#f6f8f9;
  --hdr-h:76px;
}
body{font-family:'Aptos Display','Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--txt);background:#fff;font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.pop{font-family:'Poppins',sans-serif}

/* ---------- Barra superior (línea gráfica Made Easy) ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--dark);
  position:sticky;top:0;z-index:60;flex-wrap:wrap;box-shadow:0 2px 10px rgba(31,44,52,.25)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img.logo{height:40px;width:auto;display:block}
.brand .divider{width:1px;height:38px;background:rgba(255,255,255,.22)}
.brand h1{font-size:19px;font-weight:700;color:#fff;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:#a9bcc6;margin-top:2px;font-weight:500}
.brand .sub b{color:var(--yellow);font-weight:700}
.engimg{height:56px;width:auto;opacity:.95}

.navgrp{display:flex;align-items:center;gap:10px}
.arrow{width:46px;height:46px;border-radius:50%;border:2px solid var(--green);background:var(--green);
  color:#fff;cursor:pointer;display:grid;place-items:center;font-size:27px;font-weight:700;line-height:1;
  font-family:'Poppins',sans-serif;transition:.15s;box-shadow:0 2px 8px rgba(112,173,71,.45);padding-bottom:4px}
.arrow:hover{background:#82c455;border-color:#82c455;transform:scale(1.08)}
.arrow:active{transform:scale(.96)}
.btn{border:2px solid rgba(255,255,255,.35);background:transparent;border-radius:8px;padding:9px 16px;cursor:pointer;
  font-size:14px;font-weight:600;color:#fff;font-family:'Poppins',sans-serif;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14);border-color:#fff}
.curlabel{font-family:'Poppins',sans-serif;font-size:21px;font-weight:600;color:#fff;min-width:235px;
  line-height:1.15;text-align:center}
.curlabel .wk{font-size:12.5px;color:var(--yellow);display:block;font-weight:600;letter-spacing:.4px;margin-top:2px}
.spacer{flex:1}
.viewsw{display:inline-flex;border:2px solid rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
.viewsw button{border:none;background:transparent;padding:9px 17px;cursor:pointer;font-size:14px;
  font-family:'Poppins',sans-serif;font-weight:600;color:#c9d7de;border-right:1px solid rgba(255,255,255,.22)}
.viewsw button:last-child{border-right:none}
.viewsw button:hover{background:rgba(255,255,255,.1);color:#fff}
.viewsw button.on{background:var(--green);color:#fff}

/* ---------- Filtros ---------- */
.filters{padding:12px 20px;border-bottom:2px solid var(--line);background:var(--bg2);
  display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:sticky;top:var(--hdr-h);z-index:55}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--dark);margin-right:3px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:6px 15px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--txt2);font-family:inherit;transition:.13s;user-select:none;
  display:inline-flex;align-items:center;gap:7px}
.chip:hover{background:#eef2f4;border-color:#c3ccd2}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.chip.area.on{background:var(--green);border-color:var(--green)}
.chip .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.mini{background:none;border:none;color:var(--green-d);cursor:pointer;font-size:13px;font-weight:600;
  font-family:inherit;padding:4px 7px;border-radius:5px}
.mini:hover{background:var(--green-l)}

/* ---------- Desplegable de cursos ---------- */
.dd{position:relative}
.ddbtn{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--green);background:var(--green);
  border-radius:8px;padding:8px 15px;cursor:pointer;font-size:14px;font-weight:600;font-family:'Poppins',sans-serif;color:#fff}
.ddbtn:hover{background:#82c455;border-color:#82c455}
.ddbtn .cnt{background:#fff;color:var(--green-d);border-radius:12px;padding:1px 9px;font-size:12.5px;font-weight:700}
.ddpanel{display:none;position:absolute;top:calc(100% + 8px);left:0;width:470px;max-height:480px;
  background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 10px 32px rgba(31,44,52,.28);
  z-index:200;flex-direction:column;overflow:hidden}
.ddpanel.open{display:flex}
.ddsearch{padding:12px;border-bottom:1px solid var(--line2)}
.ddsearch input{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none}
.ddsearch input:focus{border-color:var(--green)}
.ddacts{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line2);background:var(--bg2);flex-wrap:wrap}
.ddlist{overflow-y:auto;padding:5px 0;flex:1}
.ddgrp{font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.9px;color:var(--dark);
  padding:10px 14px 5px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#fff}
.ddgrp .bar{width:12px;height:12px;border-radius:3px}
.ddgrp .all{margin-left:auto;font-weight:600;letter-spacing:0}
.ddrow{display:flex;align-items:center;gap:11px;padding:7px 14px;cursor:pointer;font-size:13.5px}
.ddrow:hover{background:var(--green-l)}
.ddrow input{accent-color:var(--green);width:17px;height:17px;cursor:pointer;flex:none}
.ddrow .nv{font-size:11.5px;background:var(--dark);color:#fff;border-radius:5px;padding:2px 7px;font-weight:700;flex:none}
.ddrow .nm{flex:1;line-height:1.3;font-weight:600}
.ddrow .nm small{display:block;color:#8b9ca6;font-size:11.5px;font-weight:500;margin-top:1px}
.ddrow .n{font-size:12px;color:#9aa8b0;flex:none;font-weight:600}
.ddrow.hide{display:none}
.ddfoot{padding:10px 14px;border-top:1px solid var(--line2);background:var(--bg2);font-size:12.5px;color:var(--txt2);font-weight:500}

/* ---------- Cursos seleccionados ---------- */
.selwrap{position:relative;background:#fff}
.selrow{padding:9px 130px 9px 20px;border-bottom:2px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;
  align-items:center;align-content:flex-start;max-height:42px;overflow:hidden;transition:max-height .2s}
.selrow.exp{max-height:none;padding-bottom:10px}
.selmore{position:absolute;right:16px;top:8px;background:var(--dark);border:none;border-radius:15px;
  padding:5px 14px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;z-index:2}
.selmore:hover{background:var(--green)}
.tag{display:inline-flex;align-items:center;gap:8px;border-radius:15px;padding:4px 7px 4px 12px;
  font-size:12.5px;font-weight:600;border:1.5px solid}
.tag button{border:none;background:transparent;cursor:pointer;font-size:16px;line-height:1;color:inherit;opacity:.55;padding:0 3px}
.tag button:hover{opacity:1}
.emptysel{font-size:13.5px;color:#9aa8b0;font-style:italic}

/* ---------- Barra de resumen ---------- */
.stats{padding:9px 20px;font-size:13.5px;color:var(--txt2);border-bottom:2px solid var(--line);
  background:#fff;font-weight:500}
.stats b{color:var(--dark);font-weight:700}
.stats .kpi{display:inline-block;background:var(--green-l);color:var(--green-d);border-radius:12px;
  padding:2px 11px;font-weight:700;margin-right:9px}

/* ---------- Vista SEMANA ---------- */
.wgrid{min-width:1120px;display:grid;grid-template-columns:66px repeat(6,minmax(0,1fr));border-bottom:3px solid var(--dark)}
.wdayhdr{border-left:1px solid var(--line2);padding:9px 4px 11px;text-align:center;position:sticky;background:#fff;z-index:20}
.wdayhdr .dn{font-family:'Poppins',sans-serif;font-size:12.5px;letter-spacing:1.2px;color:var(--txt2);
  text-transform:uppercase;font-weight:700}
.wdayhdr .dd2{font-family:'Poppins',sans-serif;font-size:27px;font-weight:600;color:var(--dark);margin-top:3px;
  width:44px;height:44px;line-height:44px;border-radius:50%;margin-inline:auto}
.wdayhdr.today .dn{color:var(--green-d)}
.wdayhdr.today .dd2{background:var(--green);color:#fff}
.wcorner{position:sticky;background:#fff;z-index:20}
.wbody{min-width:1120px;display:grid;grid-template-columns:66px repeat(6,minmax(0,1fr));position:relative}
.wtimes{position:relative}
.wtimes .t{height:82px;position:relative}
.wtimes .t span{position:absolute;right:9px;top:-9px;font-size:12.5px;color:var(--txt2);font-weight:700}
.wcol{border-left:1px solid var(--line2);position:relative}
.wcol .slot{height:82px;border-bottom:1px solid var(--line2)}
.wcol.sat{background:#fbfcfc}
.ev{position:absolute;border-radius:7px;padding:6px 8px;overflow:hidden;cursor:pointer;
  border-left:5px solid;line-height:1.2;transition:.12s;z-index:5}
.ev:hover{filter:brightness(.94);z-index:30;box-shadow:0 3px 12px rgba(31,44,52,.35)}
.ev.exam{border-left-width:9px}
.ev .t1{font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .t2{font-size:13px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t3{font-size:12.5px;font-weight:500;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  background:rgba(255,255,255,.65);border-radius:4px;padding:1px 5px;margin-right:5px}
.ev.tight{padding:4px 7px}
.ev.tight .t1{-webkit-line-clamp:1;font-size:12.5px}
.ev.tight .t2{font-size:12px;margin-top:1px}
.ev.tight .t3{display:none}
.ev.narrow{padding:5px 6px}
.ev.narrow .t1{font-size:11.5px;-webkit-line-clamp:3;letter-spacing:-.2px}
.ev.narrow .t2{font-size:11.5px;margin-top:2px}
.ev.narrow .t2 .badge{display:none}
.ev.narrow .t3{display:none}
.ev.narrow.tight .t1{-webkit-line-clamp:1}

/* ---------- Vista MES ---------- */
.mgrid{min-width:1060px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line2)}
.mhdr{padding:10px 4px;text-align:center;font-family:'Poppins',sans-serif;font-size:12.5px;letter-spacing:1.2px;
  color:#fff;text-transform:uppercase;font-weight:700;background:var(--dark);border-right:1px solid rgba(255,255,255,.12);position:sticky}
.mcell{min-height:142px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px 5px 6px}
.mcell.off{background:#fafbfb}
.mcell .dnum{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--txt2);text-align:center;
  width:28px;height:28px;line-height:28px;border-radius:50%;margin:2px auto 4px}
.mcell.today .dnum{background:var(--green);color:#fff}
.mev{border-radius:5px;padding:3px 7px;font-size:12px;margin-bottom:3px;cursor:pointer;
  border-left:4px solid;line-height:1.3;overflow:hidden}
.mev b{font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mev .hh{font-weight:700;font-size:11.5px;opacity:.92}
.mev.exam{border-left-width:7px}
.mev:hover{filter:brightness(.93)}
.more{font-size:12px;color:var(--green-d);padding:2px 6px;cursor:pointer;font-weight:700}
.more:hover{text-decoration:underline}

/* ---------- Vista AGENDA ---------- */
.ag{max-width:1080px;margin:0 auto;padding:16px 20px}
.agday{display:flex;gap:20px;padding:15px 0;border-bottom:1px solid var(--line2)}
.agdate{width:120px;flex:none;text-align:right}
.agdate .d1{font-family:'Poppins',sans-serif;font-size:30px;font-weight:600;color:var(--dark);line-height:1}
.agdate .d2{font-size:12px;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin-top:4px;font-weight:600}
.agdate.today .d1{color:var(--green)}
.aglist{flex:1;display:flex;flex-direction:column;gap:6px}
.agev{display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:8px;cursor:pointer;border-left:6px solid}
.agev.exam{border-left-width:10px}
.agev:hover{filter:brightness(.95)}
.agev .hr{font-size:14px;font-weight:700;width:120px;flex:none}
.agev .bd{flex:1;min-width:0}
.agev .nm{font-family:'Poppins',sans-serif;font-size:14.5px;font-weight:700}
.agev .mt{font-size:12.5px;opacity:.85;margin-top:3px;font-weight:500}
.agmonth{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:#fff;background:var(--dark);padding:8px 16px;border-radius:7px;margin:22px 0 8px;display:inline-block}
.empty{text-align:center;padding:60px 20px;color:#9aa8b0;font-size:15px}
.empty .big{font-size:48px;margin-bottom:12px;opacity:.5}

/* ---------- Modal ---------- */
.ov{display:none;position:fixed;inset:0;background:rgba(31,44,52,.62);z-index:300;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;box-shadow:0 16px 44px rgba(0,0,0,.4);overflow:hidden}
.mhead{padding:18px 22px;background:var(--dark);display:flex;gap:14px;align-items:flex-start}
.mhead .bar{width:6px;border-radius:3px;align-self:stretch;flex:none}
.mhead h3{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;line-height:1.3;color:#fff}
.mhead .sub2{font-size:12.5px;color:var(--yellow);margin-top:5px;font-weight:600;letter-spacing:.3px}
.mhead .x{margin-left:auto;border:none;background:transparent;font-size:24px;cursor:pointer;color:#a9bcc6;line-height:1}
.mhead .x:hover{color:#fff}
.mbody{padding:16px 22px 22px}
.mrow{display:flex;gap:14px;padding:8px 0;font-size:14px;align-items:flex-start;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:none}
.mrow .k{width:110px;flex:none;color:var(--txt2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding-top:3px}
.mrow .v{flex:1;font-weight:500}
.pill{display:inline-block;padding:3px 12px;border-radius:13px;font-size:12.5px;font-weight:700}
.legend{padding:14px 20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:12.5px;
  color:var(--txt2);border-top:2px solid var(--line);background:var(--bg2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.legend img{height:24px;opacity:.85}
.wrap{padding:0 0 10px;overflow-x:auto}
@media(max-width:1100px){
  .curlabel{min-width:auto;font-size:17px}
  .engimg{display:none}
  .ddpanel{width:min(470px,92vw)}
  .agdate{width:70px}
  .wbody,.wgrid{grid-template-columns:52px repeat(6,minmax(0,1fr))}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img class="logo" id="logoME" alt="Made Easy">
    <div class="divider"></div>
    <div>
      <h1>Calendario de Evaluaciones</h1>
      <div class="sub">Ingeniería Industrial · Ciclo <b>2026-2</b> · 17 ago – 11 dic 2026</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="navgrp">
    <button class="arrow" id="btnPrev" title="Anterior">‹</button>
    <div class="curlabel" id="curLabel">—</div>
    <button class="arrow" id="btnNext" title="Siguiente">›</button>
    <button class="btn" id="btnToday">Hoy</button>
  </div>
  <div class="spacer"></div>
  <div class="viewsw" id="viewSw">
    <button data-v="week" class="on">Semana</button>
    <button data-v="month">Mes</button>
    <button data-v="agenda">Agenda</button>
  </div>
  <button class="btn" id="btnIcs" title="Descargar los eventos filtrados como archivo .ics">⤓ .ics</button>
  <img class="engimg" id="logoEng" alt="">
</div>

<div class="filters">
  <div class="fgroup">
    <span class="flabel">Ciclo</span>
    <div id="lvlChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <button class="mini" data-all="lvl">Todos</button>
  </div>
  <div class="fgroup">
    <span class="flabel">Rama</span>
    <div id="areaChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <button class="mini" data-all="area">Todas</button>
  </div>
  <div class="fgroup">
    <span class="flabel">Tipo</span>
    <div id="typeChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div class="fgroup">
    <span class="flabel">Cursos</span>
    <div class="dd" id="dd">
      <button class="ddbtn" id="ddBtn">
        <span>Seleccionar cursos</span><span class="cnt" id="ddCnt">0</span><span class="car">▾</span>
      </button>
      <div class="ddpanel" id="ddPanel">
        <div class="ddsearch"><input type="text" id="ddSearch" placeholder="Buscar curso o código…"></div>
        <div class="ddacts">
          <button class="mini" id="ddAll">Agregar todos</button>
          <button class="mini" id="ddNone">Quitar todos</button>
          <button class="mini" id="ddVis">Solo los visibles</button>
        </div>
        <div class="ddlist" id="ddList"></div>
        <div class="ddfoot" id="ddFoot"></div>
      </div>
    </div>
  </div>
</div>

<div class="selwrap"><div class="selrow" id="selRow"></div><button class="selmore" id="selMore">ver todos</button></div>
<div class="stats" id="stats"></div>
<div class="wrap" id="cal"></div>
<div class="legend" id="legend"></div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

document.getElementById('logoME').src = LOGO_ME;
document.getElementById('logoEng').src = LOGO_ENG;

const AREA_STYLE = {
  'ANALYTICS':    {bg:'#cfe7f7', bd:'#1B6E9E', tx:'#0B3E5C', solid:'#2B8FD0'},
  'FINANZAS':     {bg:'#d7ecd1', bd:'#4A8B40', tx:'#22491D', solid:'#5AA84E'},
  'SUPPLY CHAIN': {bg:'#faf1b9', bd:'#A98A0E', tx:'#584A04', solid:'#D4B224'},
  'INGENIERÍA':   {bg:'#fbdcc6', bd:'#C96C26', tx:'#733A11', solid:'#E28B45'},
  'GESTIÓN':      {bg:'#fbd2d2', bd:'#B84545', tx:'#6B2626', solid:'#D96A6A'}
};
const AREA_ORDER = ['ANALYTICS','FINANZAS','SUPPLY CHAIN','INGENIERÍA','GESTIÓN'];
const TYPE_ABBR = {'Examen':'EXAMEN','Práctica':'PRÁCTICA','Laboratorio':'LAB','Práctica dirigida':'DIRIGIDA'};
const TYPES = ['Examen','Práctica','Laboratorio'];
const LEVELS = [5,6,7,8,9,10];
const DIAS_S = ['LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const DIAS_M = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const SEM_START = '2026-08-17', SEM_END = '2026-12-11';
const H0 = 8, H1 = 22, PX = 82;   // grilla horaria: 82 px por hora

/* ============ UTILIDADES DE FECHA (sin zona horaria) ============ */
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const ds = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; };
const mins = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const semWeek = d => 2 + Math.round((monday(d)-monday(pd(SEM_START)))/604800000);

/* ============ CURSOS ============ */
const COURSES = (() => {
  const m = new Map();
  EVENTS.forEach(e => {
    if(!m.has(e.clave)) m.set(e.clave,{clave:e.clave,curso:e.curso,nivel:e.nivel,area:e.area,resp:e.resp,n:0});
    m.get(e.clave).n++;
  });
  return [...m.values()].sort((a,b)=>
    AREA_ORDER.indexOf(a.area)-AREA_ORDER.indexOf(b.area) || a.nivel-b.nivel || a.curso.localeCompare(b.curso));
})();

/* ============ ESTADO ============ */
const S = {
  view:'week',
  levels:new Set(LEVELS),
  areas:new Set(AREA_ORDER),
  types:new Set(TYPES),
  courses:new Set(COURSES.map(c=>c.clave)),
  cursor: (()=>{ const t=new Date(); const a=pd(SEM_START), b=pd(SEM_END);
                 return t<a? a : (t>b? b : t); })()
};
const candidates = () => COURSES.filter(c=>S.levels.has(c.nivel) && S.areas.has(c.area));
const filtered = () => EVENTS.filter(e =>
  S.levels.has(e.nivel) && S.areas.has(e.area) && S.types.has(e.tipo) && S.courses.has(e.clave));

/* ============ FILTROS ============ */
const $ = id => document.getElementById(id);

function buildChips(){
  $('lvlChips').innerHTML = LEVELS.map(l=>`<button class="chip lvl on" data-l="${l}">${l}°</button>`).join('');
  $('areaChips').innerHTML = AREA_ORDER.map(a=>{
    const s=AREA_STYLE[a];
    return `<button class="chip area on" data-a="${a}"><i class="dot" style="background:${s.solid}"></i>${a}</button>`;
  }).join('');
  $('typeChips').innerHTML = TYPES.map(t=>`<button class="chip ty on" data-t="${t}">${t}</button>`).join('');

  $('lvlChips').onclick = e => { const b=e.target.closest('[data-l]'); if(!b) return;
    const l=+b.dataset.l; S.levels.has(l)?S.levels.delete(l):S.levels.add(l); syncCourses(); render(); };
  $('areaChips').onclick = e => { const b=e.target.closest('[data-a]'); if(!b) return;
    const a=b.dataset.a; S.areas.has(a)?S.areas.delete(a):S.areas.add(a); syncCourses(); render(); };
  $('typeChips').onclick = e => { const b=e.target.closest('[data-t]'); if(!b) return;
    const t=b.dataset.t; S.types.has(t)?S.types.delete(t):S.types.add(t); render(); };
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{
    if(b.dataset.all==='lvl') S.levels = new Set(LEVELS); else S.areas = new Set(AREA_ORDER);
    syncCourses(); render();
  });
}
function syncCourses(){ S.courses = new Set(candidates().map(c=>c.clave)); }
function paintChips(){
  document.querySelectorAll('.chip.lvl').forEach(b=>b.classList.toggle('on',S.levels.has(+b.dataset.l)));
  document.querySelectorAll('.chip.area').forEach(b=>b.classList.toggle('on',S.areas.has(b.dataset.a)));
  document.querySelectorAll('.chip.ty').forEach(b=>b.classList.toggle('on',S.types.has(b.dataset.t)));
}

/* ============ DESPLEGABLE DE CURSOS ============ */
function buildDD(){
  let h='';
  AREA_ORDER.forEach(a=>{
    const list = COURSES.filter(c=>c.area===a);
    if(!list.length) return;
    h += `<div class="ddgrp" data-g="${a}"><span class="bar" style="background:${AREA_STYLE[a].solid}"></span>${a}
          <button class="mini all" data-garea="${a}">alternar</button></div>`;
    list.forEach(c=>{
      h += `<label class="ddrow" data-k="${c.clave}" data-s="${(c.curso+' '+c.clave).toLowerCase()}">
        <input type="checkbox" data-c="${c.clave}">
        <span class="nv">${c.nivel}°</span>
        <span class="nm">${c.curso}<small>${c.clave} · ${c.resp.join(' / ')}</small></span>
        <span class="n">${c.n}</span></label>`;
    });
  });
  $('ddList').innerHTML = h;

  $('ddBtn').onclick = e => { e.stopPropagation(); $('ddPanel').classList.toggle('open'); };
  document.addEventListener('click', e => { if(!$('dd').contains(e.target)) $('ddPanel').classList.remove('open'); });
  $('ddList').onchange = e => { const cb=e.target.closest('[data-c]'); if(!cb) return;
    cb.checked ? S.courses.add(cb.dataset.c) : S.courses.delete(cb.dataset.c); render(); };
  $('ddList').onclick = e => { const b=e.target.closest('[data-garea]'); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    const list = COURSES.filter(c=>c.area===b.dataset.garea);
    const allOn = list.every(c=>S.courses.has(c.clave));
    list.forEach(c => allOn ? S.courses.delete(c.clave) : S.courses.add(c.clave));
    render();
  };
  $('ddAll').onclick = ()=>{ COURSES.forEach(c=>S.courses.add(c.clave)); render(); };
  $('ddNone').onclick = ()=>{ S.courses.clear(); render(); };
  $('ddVis').onclick = ()=>{ syncCourses(); render(); };
  $('ddSearch').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.ddrow').forEach(r=>r.classList.toggle('hide', q && !r.dataset.s.includes(q)));
    document.querySelectorAll('.ddgrp').forEach(g=>{
      let n=g.nextElementSibling, vis=false;
      while(n && n.classList.contains('ddrow')){ if(!n.classList.contains('hide')) vis=true; n=n.nextElementSibling; }
      g.style.display = vis?'':'none';
    });
  };
}
function paintDD(){
  document.querySelectorAll('[data-c]').forEach(cb=>cb.checked = S.courses.has(cb.dataset.c));
  $('ddCnt').textContent = S.courses.size;
  $('ddFoot').textContent = `${S.courses.size} de ${COURSES.length} cursos agregados al calendario`;

  const sel = COURSES.filter(c=>S.courses.has(c.clave));
  $('selRow').innerHTML = `<span class="flabel">En el calendario</span>` + (sel.length
    ? sel.map(c=>{ const s=AREA_STYLE[c.area];
        return `<span class="tag" style="background:${s.bg};border-color:${s.bd}55;color:${s.tx}">
          ${c.nivel}° · ${c.curso}<button data-rm="${c.clave}" title="Quitar">×</button></span>`;}).join('')
    : `<span class="emptysel">Ningún curso seleccionado — usa el botón verde «Seleccionar cursos» para agregarlos.</span>`);
  $('selRow').onclick = e => { const b=e.target.closest('[data-rm]'); if(!b) return;
    S.courses.delete(b.dataset.rm); render(); };
}

/* ============ RENDER ============ */
function render(){
  paintChips(); paintDD();
  const ev = filtered();
  const byType = {}; ev.forEach(e=>byType[e.tipo]=(byType[e.tipo]||0)+1);
  const PLU={'Examen':['examen','exámenes'],'Práctica':['práctica','prácticas'],'Laboratorio':['laboratorio','laboratorios']};
  const nc = new Set(ev.map(e=>e.clave)).size;
  $('stats').innerHTML = `<span class="kpi">${ev.length} ${ev.length===1?'evaluación':'evaluaciones'}</span>`
    + TYPES.map(t=>{const n=byType[t]||0; return `<b>${n}</b> ${PLU[t][n===1?0:1]}`;}).join(' · ')
    + ` · <b>${nc}</b> ${nc===1?'curso':'cursos'} en pantalla`;
  $('legend').innerHTML = AREA_ORDER.map(a=>`<span><i style="background:${AREA_STYLE[a].solid}"></i>${a}</span>`).join('')
    + `<span style="margin-left:auto">Barra lateral gruesa = <b style="color:#1F2C34;margin-left:3px">EXAMEN</b></span>
       <img src="${LOGO_ME}" alt="Made Easy">`;
  document.querySelectorAll('#viewSw button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  if(S.view==='week') renderWeek(ev);
  else if(S.view==='month') renderMonth(ev);
  else renderAgenda(ev);
  requestAnimationFrame(()=>{ syncSelMore(); syncSticky(); });
}
const evStyle = e => { const s=AREA_STYLE[e.area];
  return `background:${s.bg};color:${s.tx};border-left-color:${s.bd};`; };

/* ---------- SEMANA ---------- */
function renderWeek(ev){
  const mon = monday(S.cursor);
  const days = Array.from({length:6},(_,i)=>addD(mon,i));
  $('curLabel').innerHTML = `${mon.getDate()} ${MESES[mon.getMonth()].slice(0,3)} – ${days[5].getDate()} ${MESES[days[5].getMonth()].slice(0,3)} ${days[5].getFullYear()}
    <span class="wk">SEMANA ${semWeek(mon)} DEL CICLO</span>`;
  const today = ds(new Date());

  let h = `<div class="wgrid"><div class="wcorner"></div>` + days.map((d,i)=>
    `<div class="wdayhdr${ds(d)===today?' today':''}"><div class="dn">${DIAS_S[i]}</div><div class="dd2">${d.getDate()}</div></div>`).join('') + `</div>`;

  h += `<div class="wbody"><div class="wtimes">` +
    Array.from({length:H1-H0},(_,i)=>`<div class="t">${i?`<span>${String(H0+i).padStart(2,'0')}:00</span>`:''}</div>`).join('') + `</div>`;

  days.forEach((d,i)=>{
    const key = ds(d);
    const list = ev.filter(e=>e.fecha===key).sort((a,b)=>mins(a.hi)-mins(b.hi)||mins(b.hf)-mins(a.hf));
    const clusters=[]; let cur=[], end=-1;
    list.forEach(e=>{ const s=mins(e.hi),t=mins(e.hf);
      if(cur.length && s>=end){ clusters.push(cur); cur=[]; end=-1; }
      cur.push(e); end=Math.max(end,t); });
    if(cur.length) clusters.push(cur);
    let cells='';
    clusters.forEach(cl=>{
      const lanes=[];            // fin de cada carril
      const byLane=[];           // eventos de cada carril
      cl.forEach(e=>{ const s=mins(e.hi),t=mins(e.hf);
        let k=lanes.findIndex(L=>L<=s); if(k<0){ k=lanes.length; byLane[k]=[]; }
        lanes[k]=t; byLane[k].push(e); e._lane=k; });
      const n=lanes.length, w=100/n;
      // cada evento se expande hacia la derecha mientras no choque con otro
      cl.forEach(e=>{
        const s=mins(e.hi), t=mins(e.hf); let span=1;
        for(let j=e._lane+1;j<n;j++){
          const choca = byLane[j].some(o=>mins(o.hi)<t && mins(o.hf)>s);
          if(choca) break; span++;
        }
        e._span=span;
      });
      cl.forEach(e=>{
        const top=(mins(e.hi)-H0*60)/60*PX, hgt=Math.max((mins(e.hf)-mins(e.hi))/60*PX-3,26);
        const wid = w*e._span;
        const cls = 'ev' + (e.tipo==='Examen'?' exam':'') + (hgt<62?' tight':'') + (wid<45?' narrow':'');
        cells += `<div class="${cls}" style="top:${top}px;height:${hgt}px;left:${e._lane*w}%;width:calc(${wid}% - 4px);${evStyle(e)}"
          data-id="${EVENTS.indexOf(e)}">
          <div class="t1">${e.curso}</div>
          <div class="t2"><span class="badge">${TYPE_ABBR[e.tipo]}</span>${e.hi} – ${e.hf}</div>
          <div class="t3">${e.nivel}° · ${e.aulas||'aula por definir'}</div>
        </div>`;
      });
    });
    h += `<div class="wcol${i===5?' sat':''}">` +
      Array.from({length:H1-H0},()=>`<div class="slot"></div>`).join('') + cells + `</div>`;
  });
  h += `</div>`;
  $('cal').innerHTML = ev.length ? h
    : h + `<div class="empty" style="padding:34px"><div class="big">📭</div>No hay evaluaciones con los filtros actuales.</div>`;
  bindEv();
}

/* ---------- MES ---------- */
function renderMonth(ev){
  const c = S.cursor, y=c.getFullYear(), m=c.getMonth();
  $('curLabel').innerHTML = `${MESES[m].charAt(0).toUpperCase()+MESES[m].slice(1)} ${y}<span class="wk">VISTA MENSUAL</span>`;
  const first = monday(new Date(y,m,1)), last = new Date(y,m+1,0);
  const nWeeks = Math.ceil((addD(monday(last),6)-first)/604800000);
  const today = ds(new Date());
  const byDay={}; ev.forEach(e=>(byDay[e.fecha]=byDay[e.fecha]||[]).push(e));
  Object.values(byDay).forEach(l=>l.sort((a,b)=>mins(a.hi)-mins(b.hi)));

  let h = `<div class="mgrid">` + DIAS_M.map(d=>`<div class="mhdr">${d}</div>`).join('');
  for(let i=0;i<nWeeks*7;i++){
    const d = addD(first,i), key=ds(d), off = d.getMonth()!==m;
    const list = byDay[key]||[];
    h += `<div class="mcell${off?' off':''}${key===today?' today':''}"><div class="dnum">${d.getDate()}</div>`
      + list.slice(0,3).map(e=>`<div class="mev${e.tipo==='Examen'?' exam':''}" style="${evStyle(e)}" data-id="${EVENTS.indexOf(e)}">
          <b>${e.curso}</b><span class="hh">${e.hi}–${e.hf} · ${TYPE_ABBR[e.tipo]}</span></div>`).join('')
      + (list.length>3?`<div class="more" data-day="${key}">+${list.length-3} más</div>`:'')
      + `</div>`;
  }
  $('cal').innerHTML = h + `</div>`;
  bindEv();
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>dayModal(b.dataset.day, byDay[b.dataset.day]));
}

/* ---------- AGENDA ---------- */
function renderAgenda(ev){
  $('curLabel').innerHTML = `Todo el ciclo 2026-2<span class="wk">17 AGO – 11 DIC 2026</span>`;
  const byDay={}; ev.forEach(e=>(byDay[e.fecha]=byDay[e.fecha]||[]).push(e));
  const keys = Object.keys(byDay).sort();
  if(!keys.length){ $('cal').innerHTML = `<div class="empty"><div class="big">📭</div>No hay evaluaciones con los filtros actuales.</div>`; return; }
  const today = ds(new Date());
  let h='<div class="ag">', lastM='';
  keys.forEach(k=>{
    const d=pd(k), mk=`${d.getFullYear()}-${d.getMonth()}`;
    if(mk!==lastM){ lastM=mk; h += `<div class="agmonth">${MESES[d.getMonth()]} ${d.getFullYear()}</div>`; }
    const list = byDay[k].sort((a,b)=>mins(a.hi)-mins(b.hi));
    h += `<div class="agday"><div class="agdate${k===today?' today':''}">
        <div class="d1">${d.getDate()}</div><div class="d2">${DIAS_M[(d.getDay()+6)%7]} · sem ${semWeek(d)}</div></div>
      <div class="aglist">` + list.map(e=>`
        <div class="agev${e.tipo==='Examen'?' exam':''}" style="${evStyle(e)}" data-id="${EVENTS.indexOf(e)}">
          <div class="hr">${e.hi} – ${e.hf}</div>
          <div class="bd"><div class="nm">${e.curso}</div>
            <div class="mt">${TYPE_ABBR[e.tipo]} · ${e.nivel}° ciclo · ${e.area} · ${e.aulas||'aula por definir'}</div></div>
        </div>`).join('') + `</div></div>`;
  });
  $('cal').innerHTML = h+'</div>';
  bindEv();
}

/* ============ MODALES ============ */
function bindEv(){ document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openEv(EVENTS[+el.dataset.id])); }
function openEv(e){
  const s=AREA_STYLE[e.area], d=pd(e.fecha);
  $('modal').innerHTML = `
    <div class="mhead"><div class="bar" style="background:${s.solid}"></div>
      <div><h3>${e.curso}</h3><div class="sub2">${e.clave} · ${e.nivel}° CICLO · ${e.area}</div></div>
      <button class="x" onclick="closeOv()">×</button></div>
    <div class="mbody">
      <div class="mrow"><div class="k">Tipo</div><div class="v"><span class="pill" style="background:${s.bg};color:${s.tx}">${e.tipo}</span></div></div>
      <div class="mrow"><div class="k">Fecha</div><div class="v">${e.dia} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()} <span style="color:#9aa8b0">(semana ${e.semana})</span></div></div>
      <div class="mrow"><div class="k">Hora</div><div class="v"><b>${e.hi} – ${e.hf}</b></div></div>
      <div class="mrow"><div class="k">Horarios</div><div class="v">${e.hor||'—'} <span style="color:#9aa8b0">(${e.nh})</span></div></div>
      <div class="mrow"><div class="k">Aulas</div><div class="v">${e.aulas||'por definir'}</div></div>
      <div class="mrow"><div class="k">Responsable</div><div class="v">${e.resp.join(' / ')}</div></div>
      <div class="mrow"><div class="k">Secuencia</div><div class="v">${e.seq} — ${e.seqm}</div></div>
      <div class="mrow"><div class="k">Vacantes</div><div class="v">${e.vac ?? '—'}</div></div>
    </div>`;
  $('ov').classList.add('open');
}
function dayModal(key, list){
  const d=pd(key);
  $('modal').innerHTML = `<div class="mhead"><div class="bar" style="background:#70AD47"></div>
    <div><h3>${d.getDate()} de ${MESES[d.getMonth()]}</h3><div class="sub2">${list.length} EVALUACIONES</div></div>
    <button class="x" onclick="closeOv()">×</button></div>
    <div class="mbody" style="max-height:62vh;overflow:auto">` + list.map(e=>`
      <div class="agev${e.tipo==='Examen'?' exam':''}" style="${evStyle(e)};margin-bottom:6px" data-id="${EVENTS.indexOf(e)}">
        <div class="hr" style="width:105px;font-size:13px">${e.hi}–${e.hf}</div>
        <div class="bd"><div class="nm" style="font-size:13.5px">${e.curso}</div>
        <div class="mt">${TYPE_ABBR[e.tipo]} · ${e.nivel}° · ${e.aulas||'por definir'}</div></div></div>`).join('') + `</div>`;
  $('ov').classList.add('open');
  $('modal').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openEv(EVENTS[+el.dataset.id]));
}
function closeOv(){ $('ov').classList.remove('open'); }
$('ov').onclick = e => { if(e.target===$('ov')) closeOv(); };
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeOv();
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft') shift(-1);
  if(e.key==='ArrowRight') shift(1);
});

/* ============ NAVEGACIÓN ============ */
$('viewSw').onclick = e => { const b=e.target.closest('[data-v]'); if(!b) return; S.view=b.dataset.v; render(); };
$('btnPrev').onclick = ()=>shift(-1);
$('btnNext').onclick = ()=>shift(1);
function shift(n){
  if(S.view==='week') S.cursor = addD(S.cursor, 7*n);
  else if(S.view==='month') S.cursor = new Date(S.cursor.getFullYear(), S.cursor.getMonth()+n, 1);
  else return;
  render();
}
$('btnToday').onclick = ()=>{ const t=new Date(), a=pd(SEM_START), b=pd(SEM_END);
  S.cursor = t<a? a : (t>b? b : t); render(); };

/* ============ EXPORTAR .ICS ============ */
$('btnIcs').onclick = ()=>{
  const fmt=(f,t)=>{ const [y,m,d]=f.split('-'); const [hh,mm]=t.split(':'); return `${y}${m}${d}T${hh}${mm}00`; };
  const ev = filtered();
  let ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Made Easy//Evaluaciones 2026-2//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Evaluaciones 2026-2'];
  ev.forEach((e,i)=>{
    ics.push('BEGIN:VEVENT',`UID:eval-${i}-262@madeeasy`,`DTSTART;TZID=America/Lima:${fmt(e.fecha,e.hi)}`,
      `DTEND;TZID=America/Lima:${fmt(e.fecha,e.hf)}`,
      `SUMMARY:${e.tipo} · ${e.curso}`,
      `LOCATION:${(e.aulas||'').replace(/,/g,'\\,')}`,
      `DESCRIPTION:${e.clave} · ${e.nivel}° ciclo · ${e.area}\\nHorarios: ${(e.hor||'').replace(/,/g,'\\,')}\\nResponsable: ${e.resp.join(' / ')}`,
      'END:VEVENT');
  });
  ics.push('END:VCALENDAR');
  const blob = new Blob([ics.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='evaluaciones_2026-2.ics'; a.click();
};

/* ============ CABECERAS PEGAJOSAS Y FILA DE CURSOS ============ */
$('selMore').onclick = ()=>{
  const r=$('selRow'); r.classList.toggle('exp');
  $('selMore').textContent = r.classList.contains('exp') ? 'ver menos' : 'ver todos';
};
function syncSelMore(){ $('selMore').style.display = $('selRow').scrollHeight > 46 ? '' : 'none'; }
function syncSticky(){
  const tb = document.querySelector('.topbar').offsetHeight;
  const top = tb + document.querySelector('.filters').offsetHeight
            + document.querySelector('.selwrap').offsetHeight
            + document.querySelector('#stats').offsetHeight;
  document.documentElement.style.setProperty('--hdr-h', tb+'px');
  document.querySelectorAll('.wdayhdr,.wcorner,.mhdr').forEach(el=>el.style.top = top+'px');
}
window.addEventListener('resize', ()=>{ syncSelMore(); syncSticky(); });

/* ============ INICIO ============ */
buildChips(); buildDD(); render();
</script>
</body>
</html>
